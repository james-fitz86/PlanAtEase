services:
  - type: web
    name: planatease-backend
    env: python
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      cd planatease-backend
      pip install --no-cache-dir -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: cd planatease-backend && gunicorn config.wsgi:application --preload --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
